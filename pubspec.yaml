name: safar
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.9.1+37

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^14.8.1
  app_links: ^7.0.0

  # Environment Config
  sentry_flutter: ^9.0.0

  # Utilities
  uuid: ^4.3.3

  # UI
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0
  iconsax: ^0.0.8
  decimal: ^3.2.4
  url_launcher: ^6.3.2
  app_settings: ^7.0.0
  intl: ^0.20.2
  timeago: ^3.6.1

  # Export
  share_plus: ^10.1.4
  csv: ^6.0.0
  # PDF proof pack (#704 Slice B) — document building only. Shared through the
  # existing share_plus chokepoint (no `printing`), so export stays fully
  # offline and never fetches a font from the network.
  pdf: ">=3.12.0 <3.13.0" # 3.13 needs Dart >=3.12; this SDK is 3.11.x
  shared_preferences: ^2.5.4
  package_info_plus: ^8.2.1

  # QR codes (T3.J/K)
  qr_flutter: ^4.1.0

  # Push Notifications
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1

  # Backend - Firebase
  cloud_firestore: ^6.2.0
  cloud_functions: ^6.2.0
  firebase_auth: ^6.3.0
  skeletonizer: ^2.1.3
  haptic_feedback: ^0.6.4+3
  firebase_app_check: ^0.4.3
  google_sign_in: ^7.2.0
  # Sign in with Apple (#1256, App Store 4.8). Pinned to 7.x — every API the
  # gateway uses was verified against the 7.0.1 source; 8.x is a separate,
  # deliberate upgrade with its own API check.
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7 # SiwA nonce hashing (promoted from transitive)
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  fake_cloud_firestore: ^4.1.0+1
  firebase_auth_mocks: ^0.15.1
  firebase_core_platform_interface: ^6.0.3
  # Register a fake FirebaseAuthPlatform in
  # display_name_propagation_service_test.dart so FirebaseConfig.currentUser
  # resolves to a real uid without a platform channel (#1102).
  firebase_auth_platform_interface: ^8.1.8
  # Mock the url_launcher platform interface in tests (#354 WhatsApp invite).
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  # Provide a temp dir for share_plus's XFile.fromData in the recap-share test
  # (#722 — shareImage writes the PNG via getTemporaryDirectory).
  path_provider_platform_interface: ^2.1.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sentry_dart_plugin: ^3.4.0

# Launcher icon config lives in flutter_launcher_icons.yaml at the project
# root. Source PNGs are produced by
# `flutter test tool/generate_app_icons.dart` from the RouteMark painter so
# they cannot drift from the in-app widget.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true



  assets:
    - assets/glyphs/
    # Bundled-font licenses (SIL OFL 1.1) — registered at runtime via LicenseRegistry.
    - assets/fonts/OFL-Bricolage.txt
    - assets/fonts/OFL-Zain.txt
    - assets/fonts/OFL-SplineSansMono.txt
    - assets/fonts/OFL-ReemKufi.txt
    # Static Noto Sans Arabic (Regular) — loaded via rootBundle ONLY by the #704
    # PDF proof pack for Arabic glyph fallback (the PDF renderer embeds it, the
    # Flutter UI never uses it). Not declared under `fonts:` on purpose.
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/OFL-NotoSansArabic.txt

  # Brand typography — bundled so first-launch branding works offline and never
  # hits the Google Fonts CDN (#103). Bricolage Grotesque / Zain / Spline Sans
  # Mono are STATIC per-weight cuts (not variable) — every asset needs an
  # explicit `weight:` descriptor, or it silently nearest-weight-falls-back.
  # The Arabic display face is a small Reem Kufi subset for the current
  # Arabic wordmark only (#636). Family names MUST match the const strings in
  # lib/core/theme/tokens/typography_tokens.dart byte-for-byte.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-400.ttf
          weight: 400
        - asset: assets/fonts/Zain-700.ttf
          weight: 700
        - asset: assets/fonts/Zain-800.ttf
          weight: 800
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/SplineSansMono-400.ttf
          weight: 400
        - asset: assets/fonts/SplineSansMono-500.ttf
          weight: 500
        - asset: assets/fonts/SplineSansMono-700.ttf
          weight: 700
    - family: Rihla Arabic Display
      fonts:
        - asset: assets/fonts/ReemKufi-RihlaWordmark.ttf

  # To add more assets to your application, add entries to the assets section:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# sentry_dart_plugin config (#933) — uploads Dart debug symbols for obfuscated
# release builds so prod crash frames are readable in Sentry. org/project/
# auth_token are intentionally NOT set here: the plugin reads them from
# SENTRY_ORG / SENTRY_PROJECT / SENTRY_AUTH_TOKEN env vars, wired as GitHub
# secrets in .github/workflows/release_android.yml — never hardcode them.
sentry:
  upload_debug_symbols: true
  upload_sources: true
  # Default `commits: auto` runs `sentry-cli releases set-commits --auto`,
  # which fails on CI's shallow checkout — and must never block the release.
  commits: false
