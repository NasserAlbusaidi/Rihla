name: Readiness Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so diff-cover can find the merge-base with origin/main.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.5'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Audit Functions production dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=low

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Theme purity check
        run: bash tool/check_theme_purity.sh

      - name: ARB completeness check
        run: dart run tool/check_arb_completeness.dart

      - name: Firebase emulator rules and Functions tests (with coverage)
        # --coverage activates the jest coverageThreshold ratchet floors in
        # functions/jest.config.js (dormant without it) and writes
        # functions/coverage/lcov.info for the Functions diff floor below.
        run: npm --prefix functions run test:emulator -- --coverage

      - name: Flutter tests with coverage
        run: |
          rm -f coverage/lcov.info
          flutter test --coverage \
            test/architecture \
            test/core \
            test/features \
            test/helpers \
            test/integration \
            test/shared \
            test/unit \
            test/widget_test.dart

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Check raw coverage threshold
        run: |
          SUMMARY=$(lcov --summary coverage/lcov.info 2>&1)
          echo "$SUMMARY"
          COVERAGE=$(printf '%s\n' "$SUMMARY" \
            | awk '/lines/ && /%/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9.]+%$/) { gsub("%", "", $i); print $i; exit } }')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Unable to read line coverage from coverage/lcov.info"
            exit 1
          fi
          echo "Raw coverage: ${COVERAGE}%"
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit (coverage >= 80.0) ? 0 : 1 }'; then
            echo "::error::Raw coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "Raw coverage ${COVERAGE}% meets 80% threshold"

      - name: Check diff coverage floor (new/changed lib lines)
        run: |
          # Aggregate 80% protects the existing average; this floor makes lines
          # CHANGED in the PR clear a higher bar (90%) so an under-tested new
          # module can't ride in on the repo's healthy baseline. diff-cover reads
          # lcov directly and ignores diff lines with no coverage data, so an
          # assets-only / docs-only PR (no measurable lib lines) passes vacuously.
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 -m venv "${RUNNER_TEMP:-/tmp}/diffcover-venv"
          "${RUNNER_TEMP:-/tmp}/diffcover-venv/bin/pip" install --quiet diff-cover
          "${RUNNER_TEMP:-/tmp}/diffcover-venv/bin/diff-cover" coverage/lcov.info \
            --compare-branch=origin/main \
            --fail-under=90

      - name: Check Functions diff coverage floor (new/changed src lines)
        run: |
          # Same 90% changed-lines bar as lib/, applied to the money-critical
          # TS backend (the aggregate jest floors above protect the average;
          # this stops an under-tested new callable riding in on it). jest
          # writes lcov SF: paths relative to functions/, so prefix them for
          # a repo-root diff comparison. PRs touching no measurable
          # functions/src lines pass vacuously, mirroring the lib/ step.
          # Self-sufficient on purpose (own fetch + venv reuse-or-create) so
          # reordering or removing the lib/ diff step can't silently break it.
          git fetch --no-tags origin main:refs/remotes/origin/main
          VENV="${RUNNER_TEMP:-/tmp}/diffcover-venv"
          if [ ! -x "${VENV}/bin/diff-cover" ]; then
            python3 -m venv "${VENV}"
            "${VENV}/bin/pip" install --quiet diff-cover
          fi
          sed 's|^SF:|SF:functions/|' functions/coverage/lcov.info \
            > "${RUNNER_TEMP:-/tmp}/functions-lcov.info"
          "${VENV}/bin/diff-cover" "${RUNNER_TEMP:-/tmp}/functions-lcov.info" \
            --compare-branch=origin/main \
            --fail-under=90
