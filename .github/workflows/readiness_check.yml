name: Readiness Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.5'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Audit Functions production dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=low

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Theme purity check
        run: bash tool/check_theme_purity.sh

      - name: ARB completeness check
        run: dart run tool/check_arb_completeness.dart

      - name: Firebase emulator rules and Functions tests
        run: npm --prefix functions run test:emulator

      - name: Flutter tests with coverage
        env:
          RIHLA_IOS_SIDELOAD: 'yes'
        run: |
          rm -f coverage/lcov.info
          flutter test --coverage \
            test/architecture \
            test/core \
            test/features \
            test/helpers \
            test/integration \
            test/shared \
            test/unit \
            test/widget_test.dart

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Check raw coverage threshold
        run: |
          SUMMARY=$(lcov --summary coverage/lcov.info 2>&1)
          echo "$SUMMARY"
          COVERAGE=$(printf '%s\n' "$SUMMARY" \
            | awk '/lines/ && /%/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9.]+%$/) { gsub("%", "", $i); print $i; exit } }')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Unable to read line coverage from coverage/lcov.info"
            exit 1
          fi
          echo "Raw coverage: ${COVERAGE}%"
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit (coverage >= 80.0) ? 0 : 1 }'; then
            echo "::error::Raw coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "Raw coverage ${COVERAGE}% meets 80% threshold"
