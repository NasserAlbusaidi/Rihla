name: Android Release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*' # Triggers only when you push a tag like v1.0.1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v6

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21' # Required by current Firebase emulators; Android still targets Java 17

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: 🔐 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: 📝 Create key.properties
        run: |
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: ⚙️ Create config.json
        run: |
          cat << 'EOF' > config.json
          ${{ secrets.CONFIG_JSON }}
          EOF

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 📦 Install Functions Dependencies
        run: npm ci --prefix functions

      - name: 🧱 Build Functions
        run: npm --prefix functions run build

      - name: Functions production dependency audit
        run: npm --prefix functions audit --omit=dev --audit-level=low

      - name: 🔍 Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Theme purity check
        run: bash tool/check_theme_purity.sh

      - name: Firebase backend emulator tests
        run: |
          npx --yes firebase-tools@15.8.0 emulators:exec \
            --project rihla-safar-test \
            --only auth,firestore,storage \
            "npm --prefix functions test"

      - name: Run Tests with Coverage
        run: |
          rm -f coverage/lcov.info
          flutter test --coverage \
            test/architecture \
            test/core \
            test/features \
            test/helpers \
            test/integration \
            test/shared \
            test/unit \
            test/widget_test.dart

      - name: find.text() regression warning
        run: |
          BASELINE=135
          CURRENT=$(grep -rn "find\.text(" test/ | wc -l | tr -d ' ')
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::warning::find.text() calls increased from $BASELINE to $CURRENT. New structural assertions should use find.byKey() instead."
          fi
          echo "find.text() calls: $CURRENT (baseline: $BASELINE)"

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Check Coverage Threshold (70%)
        # TODO: ratchet back to 80% once auth/profile/settings tests catch up.
        # Current raw coverage sits at ~72%; 70% is a temporary release gate.
        run: |
          SUMMARY=$(lcov --summary coverage/lcov.info 2>&1)
          echo "$SUMMARY"
          COVERAGE=$(printf '%s\n' "$SUMMARY" \
            | awk '/lines/ && /%/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9.]+%$/) { gsub("%", "", $i); print $i; exit } }')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Unable to read line coverage from coverage/lcov.info"
            exit 1
          fi
          echo "Raw coverage: ${COVERAGE}%"
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit (coverage >= 70.0) ? 0 : 1 }'; then
            echo "::error::Raw coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi
          echo "Raw coverage ${COVERAGE}% meets 70% threshold"

      - name: Clean stale Android plugin registrant
        run: rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: 🏗️ Build App Bundle (Obfuscated)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=./build/app/outputs/symbols --dart-define-from-file=config.json --android-skip-build-dependency-validation

      - name: 🚀 Upload to Play Store (Closed Testing — "first" track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.safar.safar
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: first # Custom closed-testing track in Play Console
          status: completed
