name: Android Release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*' # Triggers only when you push a tag like v1.0.1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v6

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21' # Required by current Firebase emulators; Android still targets Java 17

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Release ref validation
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Android release uploads must run from a v* tag. Use tool/release.sh, or rerun workflow_dispatch with --ref vX.Y.Z."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Android release uploads must run from refs/tags/v*, got ${GITHUB_REF}."
              exit 1
              ;;
          esac
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit ${GITHUB_SHA} is not contained in origin/main."
            exit 1
          fi

      - name: Release readiness confirmations
        env:
          RIHLA_BACKEND_RELEASE_READY: ${{ vars.RIHLA_BACKEND_RELEASE_READY }}
          RIHLA_APP_CHECK_READY: ${{ vars.RIHLA_APP_CHECK_READY }}
          RIHLA_REAL_DEVICE_QA_READY: ${{ vars.RIHLA_REAL_DEVICE_QA_READY }}
          RIHLA_RELEASE_APPROVED_SHA: ${{ vars.RIHLA_RELEASE_APPROVED_SHA }}
        run: |
          if [ "$RIHLA_BACKEND_RELEASE_READY" != "yes" ]; then
            echo "::error::Set repository variable RIHLA_BACKEND_RELEASE_READY=yes only after Firebase backend and Hosting production checks pass."
            exit 1
          fi
          if [ "$RIHLA_APP_CHECK_READY" != "yes" ]; then
            echo "::error::Set repository variable RIHLA_APP_CHECK_READY=yes only after Android and iOS App Check are enrolled in Firebase Console."
            exit 1
          fi
          if [ "$RIHLA_REAL_DEVICE_QA_READY" != "yes" ]; then
            echo "::error::Set repository variable RIHLA_REAL_DEVICE_QA_READY=yes only after the physical-device QA matrix passes."
            exit 1
          fi
          if [ -z "$RIHLA_RELEASE_APPROVED_SHA" ]; then
            echo "::error::Set repository variable RIHLA_RELEASE_APPROVED_SHA to ${GITHUB_SHA} only after all release gates pass for this exact commit."
            exit 1
          fi
          if [ "$RIHLA_RELEASE_APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::RIHLA_RELEASE_APPROVED_SHA=${RIHLA_RELEASE_APPROVED_SHA} does not match this release commit ${GITHUB_SHA}."
            exit 1
          fi

      - name: 🔐 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: 📝 Create key.properties
        run: |
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: ⚙️ Create config.json
        run: |
          cat << 'EOF' > config.json
          ${{ secrets.CONFIG_JSON }}
          EOF

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 📦 Install Functions Dependencies
        run: npm ci --prefix functions

      - name: 🧱 Build Functions
        run: npm --prefix functions run build

      - name: 🧹 Lint Functions
        run: npm --prefix functions run lint

      - name: Functions production dependency audit
        run: npm --prefix functions audit --omit=dev --audit-level=low

      - name: 🔍 Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Theme purity check
        run: bash tool/check_theme_purity.sh

      - name: Firebase backend emulator tests
        run: npm --prefix functions run test:emulator

      - name: Run Tests with Coverage
        run: |
          rm -f coverage/lcov.info
          flutter test --coverage \
            test/architecture \
            test/core \
            test/features \
            test/helpers \
            test/integration \
            test/shared \
            test/unit \
            test/widget_test.dart

      - name: find.text() regression warning
        run: |
          BASELINE=135
          CURRENT=$(grep -rn "find\.text(" test/ | wc -l | tr -d ' ')
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::warning::find.text() calls increased from $BASELINE to $CURRENT. New structural assertions should use find.byKey() instead."
          fi
          echo "find.text() calls: $CURRENT (baseline: $BASELINE)"

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Check Coverage Threshold (80%)
        run: |
          SUMMARY=$(lcov --summary coverage/lcov.info 2>&1)
          echo "$SUMMARY"
          COVERAGE=$(printf '%s\n' "$SUMMARY" \
            | awk '/lines/ && /%/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9.]+%$/) { gsub("%", "", $i); print $i; exit } }')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Unable to read line coverage from coverage/lcov.info"
            exit 1
          fi
          echo "Raw coverage: ${COVERAGE}%"
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit (coverage >= 80.0) ? 0 : 1 }'; then
            echo "::error::Raw coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "Raw coverage ${COVERAGE}% meets 80% threshold"

      - name: Clean stale Android plugin registrant
        run: rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: 🏗️ Build App Bundle (Obfuscated)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=./build/app/outputs/symbols --dart-define-from-file=config.json --android-skip-build-dependency-validation

      # `secrets` is not available in step-level `if:` — gate the upload via a
      # check step that reads the secret from env and exports a step output.
      - name: 🔎 Check Sentry symbol upload configured
        id: sentry_check
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set — obfuscated release Dart debug symbols will NOT be uploaded to Sentry. Prod crash frames will be unsymbolicated until SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT repo secrets are set (see #933)."
          fi

      - name: 🩹 Upload Dart Debug Symbols to Sentry
        if: steps.sentry_check.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: dart run sentry_dart_plugin

      - name: 📦 Retain Dart Debug Symbols Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dart-debug-symbols
          path: build/app/outputs/symbols
          retention-days: 90

      - name: 🚀 Upload to Play Store (Closed Testing — "first" track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.safar.safar
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: first # Custom closed-testing track in Play Console
          status: completed
