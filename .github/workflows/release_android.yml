name: Android Release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*' # Triggers only when you push a tag like v1.0.1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Matches your build.gradle (Java 17)

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # Uses latest stable Flutter (includes Dart 3.10+)

      - name: 🔐 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: 📝 Create key.properties
        run: |
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: ⚙️ Create config.json
        run: |
          cat << 'EOF' > config.json
          ${{ secrets.CONFIG_JSON }}
          EOF

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Tests with Coverage
        run: |
          rm -f coverage/lcov.info
          flutter test --coverage

      - name: find.text() regression warning
        run: |
          BASELINE=135
          CURRENT=$(grep -rn "find\.text(" test/ | wc -l | tr -d ' ')
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::warning::find.text() calls increased from $BASELINE to $CURRENT. New structural assertions should use find.byKey() instead."
          fi
          echo "find.text() calls: $CURRENT (baseline: $BASELINE)"

      - name: Hardcoded color lint
        run: |
          VIOLATIONS=$(grep -rn "Color(0x" lib/ \
            --include="*.dart" \
            | grep -v "lib/core/theme/app_theme.dart" \
            | grep -v "lib/core/theme/tokens/" \
            | grep -v "lib/features/ledger/models/expense_category_model.dart" \
            | wc -l | tr -d ' ')
          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "::error::$VIOLATIONS hardcoded Color(0xFF...) literal(s) found outside the token system."
            grep -rn "Color(0x" lib/ \
              --include="*.dart" \
              | grep -v "lib/core/theme/app_theme.dart" \
              | grep -v "lib/core/theme/tokens/" \
              | grep -v "lib/features/ledger/models/expense_category_model.dart"
            exit 1
          fi
          echo "Hardcoded color lint: PASS (0 violations)"

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Check Coverage Threshold (80%)
        run: |
          lcov --remove coverage/lcov.info \
            'lib/firebase_options.dart' \
            'lib/main.dart' \
            'lib/app.dart' \
            '*.g.dart' \
            '*.freezed.dart' \
            'lib/features/trip/*' \
            'lib/features/logistics/*' \
            'lib/features/gear/*' \
            'lib/features/memories/*' \
            'lib/features/vault/*' \
            'lib/features/settings/*' \
            'lib/features/ledger/*' \
            'lib/features/activity/*' \
            'lib/features/onboarding/*' \
            'lib/features/auth/*' \
            'lib/features/home/*' \
            'lib/core/services/cache_service.dart' \
            'lib/core/services/notification_service.dart' \
            'lib/core/services/haptic_service.dart' \
            'lib/core/services/settings_service.dart' \
            'lib/core/services/local_database.dart' \
            'lib/core/router/app_router.dart' \
            'lib/core/theme/app_theme.dart' \
            'lib/core/theme/error_widgets.dart' \
            'lib/core/config/firebase_config.dart' \
            'lib/core/config/app_metadata.dart' \
            'lib/core/models/app_settings_model.dart' \
            -o coverage/lcov_filtered.info
          COVERAGE=$(lcov --summary coverage/lcov_filtered.info 2>&1 \
            | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets 80% threshold"

      - name: 🏗️ Build App Bundle (Obfuscated)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=./build/app/outputs/symbols --dart-define-from-file=config.json --android-skip-build-dependency-validation

      - name: 🚀 Upload to Play Store (Closed Alpha)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.safar.safar
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: first # 'alpha' usually maps to Closed Testing
          status: completed
