<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Rihla</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #111827;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 420px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.15;
        margin: 0 0 12px;
      }

      p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 24px;
      }

      a {
        background: #0d7b74;
        border-radius: 8px;
        color: #ffffff;
        display: inline-flex;
        font-weight: 700;
        min-height: 48px;
        padding: 0 18px;
        place-items: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open Rihla</h1>
      <p>This link is used to continue email recovery inside the Rihla app.</p>
      <a id="open-rihla" href="https://rihla-safar.firebaseapp.com/__/auth/links/continue">Open in Rihla</a>
    </main>
    <script>
      const link = document.getElementById('open-rihla');
      link.href = window.location.href;
    </script>
  </body>
</html>
