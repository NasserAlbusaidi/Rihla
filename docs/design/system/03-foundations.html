<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radius, shadow & motifs</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap");

  :root{
    --paper:#F4ECDD; --paper-2:#EFE5D2; --card:#FBF6EC;
    --ink:#211B16; --ink-soft:#5A4F44; --line:#DBCDB4;
    --terra:#BC4F2E; --terra-deep:#9E3E22; --ochre:#CE8B33;
    --palm:#2E4A3A; --gold:#E0B25A; --pos:#2E6B4F; --neg:#B0492A;
    --radius:18px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ds-frame{min-height:100vh;display:flex;flex-direction:column;gap:26px;}
  .ds-cap{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);}

  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;padding:44px;}

  .ds-frame{gap:26px;}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;}
  .rad{background:var(--card);border:1.5px solid var(--line);width:120px;height:84px;display:grid;place-items:end center;
    padding-bottom:8px;font-size:.74rem;color:var(--ink-soft);font-weight:600;}
  .r0{border-radius:12px;} .r1{border-radius:18px;} .r2{border-radius:28px;} .r3{border-radius:999px;width:84px;}
  .sh{width:150px;height:96px;border-radius:18px;background:var(--card);display:grid;place-items:center;
    font-size:.74rem;color:var(--ink-soft);font-weight:600;}
  .s1{box-shadow:0 10px 30px rgba(33,27,22,.06);}
  .s2{box-shadow:0 18px 40px rgba(33,27,22,.10);}
  .s3{box-shadow:0 24px 60px rgba(33,27,22,.24);}
  .route{display:flex;align-items:center;gap:14px;color:var(--terra);}
  .route::after{content:"";flex:1;border-top:2px dotted var(--line);}
  .pin{width:10px;height:10px;border-radius:50%;background:var(--terra);flex:none;box-shadow:0 0 0 4px rgba(188,79,46,.16);}
  .grain{height:90px;border-radius:14px;border:1.5px solid var(--line);
    background-image:radial-gradient(rgba(33,27,22,.10) 1px,transparent 1px);background-size:22px 22px;background-color:var(--paper);}
  
</style>
</head>
<body>

  <div class="ds-frame">
    <span class="ds-cap">Radius — 12 / 18 (--radius) / 28 / pill</span>
    <div class="row"><div class="rad r0">12px</div><div class="rad r1">18px</div><div class="rad r2">28px</div><div class="rad r3">pill</div></div>
    <span class="ds-cap">Elevation</span>
    <div class="row"><div class="sh s1">card</div><div class="sh s2">raised</div><div class="sh s3">deep</div></div>
    <span class="ds-cap">Route divider &amp; pin</span>
    <div class="route"><span class="pin"></span></div>
    <span class="ds-cap">Paper grain texture (22px dot grid)</span>
    <div class="grain"></div>
  </div>
  
</body>
</html>
