<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buttons</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap");

  :root{
    --paper:#F4ECDD; --paper-2:#EFE5D2; --card:#FBF6EC;
    --ink:#211B16; --ink-soft:#5A4F44; --line:#DBCDB4;
    --terra:#BC4F2E; --terra-deep:#9E3E22; --ochre:#CE8B33;
    --palm:#2E4A3A; --gold:#E0B25A; --pos:#2E6B4F; --neg:#B0492A;
    --radius:18px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ds-frame{min-height:100vh;display:flex;flex-direction:column;gap:26px;}
  .ds-cap{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);}

  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;padding:44px;}

  .ds-frame{gap:22px;}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;font-family:var(--sans);
    font-weight:600;font-size:1rem;padding:15px 26px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;}
  .btn svg{width:20px;height:20px;flex:none;}
  .btn-primary{background:var(--terra);color:#fff;box-shadow:0 10px 26px rgba(188,79,46,.32);}
  .btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink);}
  .btn-light{background:#fff;color:var(--terra-deep);box-shadow:0 14px 32px rgba(33,27,22,.26);}
  .lang{font-weight:600;font-size:.95rem;padding:9px 16px;border:1.5px solid var(--ink);border-radius:999px;}
  .onterra{background:var(--terra);border-radius:18px;padding:26px;display:flex;gap:14px;flex-wrap:wrap;}
  
</style>
</head>
<body>

  <div class="ds-frame">
    <span class="ds-cap">Primary · Ghost · Store</span>
    <div class="row">
      <a class="btn btn-primary"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.3.3-.5.7-.5 1.2v17c0 .5.2.9.5 1.2L13 13 3.6 2.3zM14.4 11.9l2.7-2.7-9.9-5.7c-.3-.2-.6-.2-.9-.1l8.1 8.5zM18.3 9.8l-3.1 3.1 3.1 3.1 2.9-1.7c.9-.5.9-1.8 0-2.3l-2.9-1.7v-.5zM14.4 14.1l-8.1 8.5c.3.1.6.1.9-.1l9.9-5.7-2.7-2.7z"/></svg> Get it on Google Play</a>
      <a class="btn btn-ghost">Learn more</a>
    </div>
    <span class="ds-cap">Pill / language toggle</span>
    <div class="row"><a class="lang" lang="ar">العربية</a><a class="btn btn-primary">Get the app</a></div>
    <span class="ds-cap">On terracotta (final CTA)</span>
    <div class="onterra"><a class="btn btn-light"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.3.3-.5.7-.5 1.2v17c0 .5.2.9.5 1.2L13 13 3.6 2.3zM14.4 11.9l2.7-2.7-9.9-5.7c-.3-.2-.6-.2-.9-.1l8.1 8.5zM18.3 9.8l-3.1 3.1 3.1 3.1 2.9-1.7c.9-.5.9-1.8 0-2.3l-2.9-1.7v-.5zM14.4 14.1l-8.1 8.5c.3.1.6.1.9-.1l9.9-5.7-2.7-2.7z"/></svg> Get it on Google Play</a></div>
  </div>
  
</body>
</html>
