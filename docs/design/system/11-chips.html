<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chips, eyebrow & badges</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap");

  :root{
    --paper:#F4ECDD; --paper-2:#EFE5D2; --card:#FBF6EC;
    --ink:#211B16; --ink-soft:#5A4F44; --line:#DBCDB4;
    --terra:#BC4F2E; --terra-deep:#9E3E22; --ochre:#CE8B33;
    --palm:#2E4A3A; --gold:#E0B25A; --pos:#2E6B4F; --neg:#B0492A;
    --radius:18px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ds-frame{min-height:100vh;display:flex;flex-direction:column;gap:26px;}
  .ds-cap{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);}

  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;padding:44px;}

  .ds-frame{gap:24px;}
  .eyebrow{font-weight:600;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--terra-deep);
    display:inline-flex;align-items:center;gap:.6em;}
  .eyebrow::before{content:"";width:26px;border-top:1.5px dotted var(--terra);}
  .chips{display:flex;flex-wrap:wrap;gap:9px;list-style:none;}
  .chips li{font-size:.82rem;font-weight:600;color:var(--ink-soft);padding:7px 14px;background:var(--card);
    border:1.5px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:.5em;}
  .chips li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ochre);}
  .ccy{display:flex;flex-wrap:wrap;gap:8px;background:var(--ink);padding:18px;border-radius:14px;}
  .ccy span{font-size:.74rem;font-weight:600;padding:6px 11px;border:1px solid rgba(244,236,221,.26);
    border-radius:999px;color:rgba(244,236,221,.9);}
  
</style>
</head>
<body>

  <div class="ds-frame">
    <span class="ds-cap">Eyebrow / kicker</span>
    <span class="eyebrow">Where Rihla earns its keep</span>
    <span class="ds-cap">Proof chips</span>
    <ul class="chips"><li>No signup</li><li>WhatsApp invites</li><li>OMR-friendly</li><li>Works offline</li></ul>
    <span class="ds-cap">Currency badges (on ink)</span>
    <div class="ccy"><span>OMR</span><span>AED</span><span>SAR</span><span>QAR</span><span>USD</span><span>EUR</span><span>GBP</span></div>
  </div>
  
</body>
</html>
