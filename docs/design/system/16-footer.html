<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Footer</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap");

  :root{
    --paper:#F4ECDD; --paper-2:#EFE5D2; --card:#FBF6EC;
    --ink:#211B16; --ink-soft:#5A4F44; --line:#DBCDB4;
    --terra:#BC4F2E; --terra-deep:#9E3E22; --ochre:#CE8B33;
    --palm:#2E4A3A; --gold:#E0B25A; --pos:#2E6B4F; --neg:#B0492A;
    --radius:18px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ds-frame{min-height:100vh;display:flex;flex-direction:column;gap:26px;}
  .ds-cap{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);}

  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;padding:44px;}

  footer{border-top:1.5px dotted var(--line);padding-top:30px;}
  .foot-row{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;}
  .brand{display:inline-flex;align-items:center;gap:12px;}
  .glyph{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;}
  .glyph svg{width:24px;height:24px;}
  .wordmark{font-family:var(--serif);font-weight:600;font-size:1.5rem;}
  .wordmark span{color:var(--terra);}
  .foot-nav{display:flex;flex-wrap:wrap;gap:8px 26px;list-style:none;}
  .foot-nav a{color:var(--ink-soft);font-weight:500;}
  .made{display:inline-flex;align-items:center;gap:.5em;font-size:.85rem;color:var(--ink-soft);margin-top:16px;}
  .made .pin{width:8px;height:8px;border-radius:50%;background:var(--palm);}
  .foot-meta{color:var(--ink-soft);font-size:.9rem;}
  
</style>
</head>
<body>

  <footer>
    <div class="foot-row">
      <a class="brand"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.4 17.1C12 14 11 9 16.6 6.9" stroke-dasharray="1.3 2.4"/></svg></span><span class="wordmark">Rihla<span>.</span></span></a>
      <nav><ul class="foot-nav"><li><a>Privacy</a></li><li><a>Terms</a></li><li><a>Delete data</a></li><li><a>Help</a></li><li><a lang="ar">العربية</a></li></ul></nav>
    </div>
    <div class="foot-row" style="margin-top:22px;">
      <span class="made"><span class="pin"></span> Built in Oman, for the GCC.</span>
      <span class="foot-meta">© 2026 Rihla.</span>
    </div>
  </footer>
  
</body>
</html>
