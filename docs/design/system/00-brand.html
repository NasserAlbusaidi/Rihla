<!-- @dsCard group="Brand" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rihla — Brand lockup</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap");

  :root{
    --paper:#F4ECDD; --paper-2:#EFE5D2; --card:#FBF6EC;
    --ink:#211B16; --ink-soft:#5A4F44; --line:#DBCDB4;
    --terra:#BC4F2E; --terra-deep:#9E3E22; --ochre:#CE8B33;
    --palm:#2E4A3A; --gold:#E0B25A; --pos:#2E6B4F; --neg:#B0492A;
    --radius:18px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ds-frame{min-height:100vh;display:flex;flex-direction:column;gap:26px;}
  .ds-cap{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);}

  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;padding:44px;}

  .lock{display:flex;align-items:center;gap:16px;}
  .glyph{width:64px;height:64px;flex:none;border-radius:18px;background:var(--ink);color:var(--paper);
    display:grid;place-items:center;box-shadow:0 8px 22px rgba(33,27,22,.2);}
  .glyph svg{width:36px;height:36px;}
  .wordmark{font-family:var(--serif);font-weight:600;font-size:2.6rem;letter-spacing:-.015em;}
  .wordmark span{color:var(--terra);}
  .tag{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.5rem;color:var(--ink-soft);margin-top:30px;}
  .tag b{color:var(--terra);font-style:normal;}
  .glyph.alt{background:var(--terra);} .glyph.alt2{background:var(--palm);}
  .row{display:flex;gap:14px;margin-top:34px;align-items:center;}
  
</style>
</head>
<body>

  <div class="ds-frame">
    <span class="ds-cap">Primary lockup</span>
    <div class="lock">
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.4 17.1C12 14 11 9 16.6 6.9" stroke-dasharray="1.3 2.4"/></svg></span>
      <span class="wordmark">Rihla<span>.</span></span>
    </div>
    <p class="tag">Split the bill. <b>Settle up.</b> Stay friends.</p>
    <span class="ds-cap" style="margin-top:8px;">Glyph — route &amp; pins (a journey)</span>
    <div class="row">
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.4 17.1C12 14 11 9 16.6 6.9" stroke-dasharray="1.3 2.4"/></svg></span>
      <span class="glyph alt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.4 17.1C12 14 11 9 16.6 6.9" stroke-dasharray="1.3 2.4"/></svg></span>
      <span class="glyph alt2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.4 17.1C12 14 11 9 16.6 6.9" stroke-dasharray="1.3 2.4"/></svg></span>
    </div>
  </div>
  
</body>
</html>
