<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Color tokens</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap");

  :root{
    --paper:#F4ECDD; --paper-2:#EFE5D2; --card:#FBF6EC;
    --ink:#211B16; --ink-soft:#5A4F44; --line:#DBCDB4;
    --terra:#BC4F2E; --terra-deep:#9E3E22; --ochre:#CE8B33;
    --palm:#2E4A3A; --gold:#E0B25A; --pos:#2E6B4F; --neg:#B0492A;
    --radius:18px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ds-frame{min-height:100vh;display:flex;flex-direction:column;gap:26px;}
  .ds-cap{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);}

  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;padding:44px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px;}
  .sw{border-radius:14px;padding:16px;height:104px;display:flex;flex-direction:column;justify-content:flex-end;
    border:1px solid rgba(33,27,22,.08);}
  .sw .nm{font-weight:600;font-size:.92rem;}
  .sw .hx{font-size:.78rem;opacity:.82;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  
</style>
</head>
<body>
<div class="ds-frame"><span class="ds-cap">Palette — warm Gulf paper, terracotta, palm</span><div class="grid"><div class="sw" style="background:#F4ECDD;color:#211B16"><span class="nm">Paper</span><span class="hx">#F4ECDD</span></div>
<div class="sw" style="background:#EFE5D2;color:#211B16"><span class="nm">Paper 2</span><span class="hx">#EFE5D2</span></div>
<div class="sw" style="background:#FBF6EC;color:#211B16"><span class="nm">Card</span><span class="hx">#FBF6EC</span></div>
<div class="sw" style="background:#211B16;color:#F4ECDD"><span class="nm">Ink</span><span class="hx">#211B16</span></div>
<div class="sw" style="background:#5A4F44;color:#F4ECDD"><span class="nm">Ink soft</span><span class="hx">#5A4F44</span></div>
<div class="sw" style="background:#DBCDB4;color:#211B16"><span class="nm">Line</span><span class="hx">#DBCDB4</span></div>
<div class="sw" style="background:#BC4F2E;color:#ffffff"><span class="nm">Terracotta</span><span class="hx">#BC4F2E</span></div>
<div class="sw" style="background:#9E3E22;color:#ffffff"><span class="nm">Terra deep</span><span class="hx">#9E3E22</span></div>
<div class="sw" style="background:#CE8B33;color:#211B16"><span class="nm">Ochre</span><span class="hx">#CE8B33</span></div>
<div class="sw" style="background:#2E4A3A;color:#F4ECDD"><span class="nm">Palm</span><span class="hx">#2E4A3A</span></div>
<div class="sw" style="background:#E0B25A;color:#211B16"><span class="nm">Gold</span><span class="hx">#E0B25A</span></div>
<div class="sw" style="background:#2E6B4F;color:#ffffff"><span class="nm">Positive</span><span class="hx">#2E6B4F</span></div>
<div class="sw" style="background:#B0492A;color:#ffffff"><span class="nm">Negative</span><span class="hx">#B0492A</span></div></div></div>
</body>
</html>
